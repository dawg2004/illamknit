<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>illamknit | cyber pop knit</title>
    <meta
      name="description"
      content="illamknitの作品を、レトロPC × ネオンポップな世界観で紹介するランディングページ。"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>

    <main class="desktop">
      <section class="window main-window">
        <div class="title-bar">
          <span>illamknit.exe</span>
          <div class="controls">
            <button aria-label="minimize">_</button>
            <button aria-label="maximize">□</button>
            <button aria-label="close">×</button>
          </div>
        </div>

        <div class="content hero-content">
          <p class="kicker">RETRO FUTURE KNIT</p>
          <h1>illamknit</h1>
          <p>
            ハンドメイドの温かさに、90sレトロPCの遊び心をミックス。
            ネオンカラーとやさしい素材感で、日常を少しだけ特別に。
          </p>
          <div class="button-row">
            <a class="pixel-btn primary" href="https://www.instagram.com/ill_am_knit/" target="_blank" rel="noreferrer">Instagram</a>
            <a class="pixel-btn" href="#about">About</a>
          </div>
        </div>
      </section>

      <section class="window side-window" id="about">
        <div class="title-bar">
          <span>about.txt</span>
          <div class="controls">
            <button aria-label="close">×</button>
          </div>
        </div>
        <div class="content">
          <h2>ABOUT</h2>
          <p>
            illamknitは、色と質感のバランスを大切にしながら一点ずつ制作するニットレーベルです。
            新作・オーダー情報はInstagramで更新中。
          </p>
        </div>
      </section>

      <section class="window music-window">
        <div class="title-bar">
          <span>now playing</span>
          <div class="controls"><button aria-label="close">×</button></div>
        </div>
        <div class="content player">
          <div class="bar"><span></span></div>
          <div class="player-actions">
            <button>◁</button>
            <button>▷</button>
            <button>❚❚</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
